<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101014">
  <title>Miixu's Café</title>
  <link rel="icon" type="image/x-icon" href="/assets/favicon.gif">
  <style>
    :root {
      color-scheme: dark;
      --bg: #121212;
      --pink: #fe5c8f;
      --white: #fff8fc;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
    }

    body {
      display: grid;
      place-items: center;
      color: var(--white);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #emoji-field {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
      contain: strict;
    }

    .emoji {
      position: absolute;
      left: 0;
      top: 0;
      line-height: 1;
      white-space: nowrap;
      user-select: none;
      -webkit-user-select: none;
      will-change: transform;
      opacity: var(--opacity);
      font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
      animation: drift var(--duration) linear var(--delay) infinite;
      transform: translate3d(-15vw, 0, 0);
    }

    @keyframes drift {
      from { transform: translate3d(-15vw, 0, 0) rotate(-12deg); }
      to   { transform: translate3d(115vw, 0, 0) rotate(12deg); }
    }

    main {
      position: relative;
      z-index: 1;
      width: min(92vw, 760px);
      padding: 2rem 1.25rem;
      text-align: center;
    }

    .mark {
      display: block;
      margin: 0 auto .8rem;
      font-size: clamp(2rem, 7vw, 3.6rem);
      line-height: 1;
      filter: drop-shadow(0 0 22px rgb(254 92 143 / 28%));
      animation: bob 3s ease-in-out infinite;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.15rem, 8.5vw, 5.3rem);
      font-weight: 900;
      letter-spacing: -.065em;
      line-height: .98;
      text-transform: uppercase;
      text-wrap: balance;
      text-shadow: 0 4px 28px rgb(0 0 0 / 40%);
    }

    .underline {
      width: clamp(72px, 16vw, 124px);
      height: 5px;
      margin: 1.2rem auto 0;
      border-radius: 999px;
      background: var(--pink);
      box-shadow: 0 0 24px rgb(254 92 143 / 38%);
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0) rotate(-5deg); }
      50% { transform: translateY(-7px) rotate(5deg); }
    }

    @media (max-width: 480px) {
      main { width: 94vw; padding: 1.5rem .5rem; }
      h1 { letter-spacing: -.055em; }
      .emoji { font-size: var(--mobile-size) !important; }
    }

    @media (prefers-reduced-motion: reduce) {
      .emoji, .mark { animation: none; }
    }
  </style>
</head>
